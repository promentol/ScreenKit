org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# AndroidX: the shell is SDL's activity and a few lines of Java, but the video
# player is Media3 ExoPlayer (app/build.gradle), which is AndroidX, and AGP
# refuses AndroidX dependencies unless this is on. Nothing needs Jetifier.
android.useAndroidX=true
android.nonTransitiveRClass=true
